{% load core_tags %}
<div class="comment">
  <a href="{{ c.author.get_absolute_url }}">{% avatar c.author 32 %}</a>
  <div style="min-width:0">
    <div class="bubble"><a class="name" href="{{ c.author.get_absolute_url }}">{{ c.author.full_name }}</a><div>{{ c.text }}</div></div>
    <div class="tools">
      <span>{{ c.created_at|ago }}</span>
      {% if c.author == user or c.post.author == user %}
      <form method="post" action="{% url 'delete_comment' c.pk %}" data-confirm="Delete this comment?">{% csrf_token %}
        <input type="hidden" name="next" value="{{ request.get_full_path }}"><button type="submit">Delete</button></form>
      {% elif c.author != user %}
      <a href="{% url 'report' 'comment' c.pk %}?next={{ request.get_full_path|urlencode }}" class="subtle">Report</a>
      {% endif %}
    </div>
  </div>
</div>
