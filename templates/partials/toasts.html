{% if messages %}
<div class="toasts" aria-live="polite">
  {% for m in messages %}
  <div class="toast {{ m.tags }}" role="status">
    <i class="bi {% if m.tags == 'error' %}bi-exclamation-circle-fill{% elif m.tags == 'info' %}bi-info-circle-fill{% elif m.tags == 'warning' %}bi-exclamation-triangle-fill{% else %}bi-check-circle-fill{% endif %}"></i>
    <span>{{ m }}</span>
    <button class="close" type="button" aria-label="Close"><i class="bi bi-x-lg"></i></button>
  </div>
  {% endfor %}
</div>
{% endif %}
